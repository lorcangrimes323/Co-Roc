    <rect x="66" y="50" width="72" height="60" rx="28" stroke="#d1253c" stroke-width="10"/>
    <path d="M91 80l10 10 21-25" stroke="#171719" stroke-width="7"/>
  </g>
  <text x="164" y="94" fill="#171719" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="-3">Co-Roc</text>
  <g transform="translate(166 112)">
