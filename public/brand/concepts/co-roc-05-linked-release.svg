<svg xmlns="http://www.w3.org/2000/svg" width="600" height="160" viewBox="0 0 600 160" role="img" aria-labelledby="title desc">
  <title id="title">Co-Roc logo concept 5 — Linked Release</title>
  <desc id="desc">Two interlocking controlled records with a release check, paired with a compact aerospace wordmark.</desc>
  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
